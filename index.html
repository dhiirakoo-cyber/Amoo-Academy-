<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salphaatti Baradhaa | Learn Easily - Amoo Academy</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Supabase SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <h1 class="text-xl font-black tracking-tight text-slate-900">
                <span class="text-blue-600">Amoo</span> Academy
            </h1>
            <div class="text-xs font-bold text-slate-500 bg-slate-100 border border-slate-200 px-3 py-1.5 rounded-lg shadow-sm">
                Sirna Koorsii | Course System
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto px-4 py-8 sm:py-12 w-full grid grid-cols-1 md:grid-cols-3 gap-8">
        
        <!-- Form Section -->
        <div class="md:col-span-1">
            <div class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200 md:sticky md:top-24">
                <h2 class="text-lg font-black text-slate-900 mb-1">
                    Koorsii Haaraa Dabali | Add New Course
                </h2>
                <p class="text-xs text-slate-500 mb-6 font-medium">
                    Odeeffannoo koorsii haaraa galchi | Enter new course details
                </p>
                
                <form id="add-course-form" onsubmit="addCourse(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">
                            Maqaa Koorsii | Course Name
                        </label>
                        <input type="text" id="course_name" required placeholder="Fkn. / E.g. Web Development" 
                               class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition text-slate-900 shadow-sm">
                    </div>
                    
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1.5 uppercase tracking-wide">
                            Afaan | Language
                        </label>
                        <select id="language" required 
                                class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium focus:outline-none focus:border-blue-500 focus:bg-white transition text-slate-900 shadow-sm cursor-pointer">
                            <option value="Afaan Oromoo">Afaan Oromoo</option>
                            <option value="English">English</option>
                            <option value="Oromoo & English">Oromoo & English</option>
                        </select>
                    </div>

                    <button type="submit" id="submit-btn" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-3.5 rounded-xl transition shadow shadow-blue-600/20 mt-4 uppercase tracking-wider flex justify-center items-center gap-2">
                        Galmeessi | Submit
                    </button>
                    
                    <div id="form-message" class="text-xs font-bold text-center hidden px-3 py-2 rounded-lg mt-3"></div>
                </form>
            </div>
        </div>

        <!-- Course List Section -->
        <div class="md:col-span-2">
            <div class="flex items-center justify-between mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                <h2 class="text-xl font-black text-slate-900">
                    Galmee Koorsii | Course Registry
                </h2>
                <button onclick="getCourses()" class="text-xs text-blue-700 hover:text-blue-900 font-bold bg-blue-50 hover:bg-blue-100 border border-blue-200 px-4 py-2 rounded-xl transition uppercase tracking-wide">
                    Haaromsi | Refresh
                </button>
            </div>
            
            <div id="loading" class="text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-600 border-t-transparent"></div>
                <p class="text-xs text-slate-500 mt-4 font-bold uppercase tracking-widest">Daataa fidaa jira | Fetching data...</p>
            </div>

            <div id="courses-list" class="grid grid-cols-1 sm:grid-cols-2 gap-5 hidden">
                <!-- Data injection point -->
            </div>
        </div>
        
    </main>

    <!-- Footer -->
    <footer class="bg-white py-6 border-t border-slate-200 mt-auto">
        <div class="max-w-5xl mx-auto px-4 text-center text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest">
            &copy; 2026 Amoo Academy. Mirgi guutuun eeggamaa dha | All rights reserved
        </div>
    </footer>

    <!-- JavaScript & Supabase Logic -->
    <script>
        // Supabase Credentials
        const SUPABASE_URL = 'https://hesjpceomicbhwbvqhdx.supabase.co';
        
        // I am using the working anon key from your previous setup so the live preview works.
        // Replace with 'YOUR_PUBLISHABLE_KEY_HERE' if you are deploying elsewhere.
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhlc2pwY2VvbWljYmh3YnZxaGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTYwOTksImV4cCI6MjA5NTczMjA5OX0.hX3JVSe_WLmfVJjvR9qqx2zT0NmL6wc1vT-0hUJLDy0';

        // Intialize Supabase Client
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        /**
         * Fetch courses from Supabase and display them
         */
        async function getCourses() {
            const listContainer = document.getElementById('courses-list');
            const loadingIndicator = document.getElementById('loading');
            
            listContainer.innerHTML = '';
            listContainer.classList.add('hidden');
            loadingIndicator.classList.remove('hidden');

            try {
                // Fetch course_name and language columns natively from Supabase
                const { data, error } = await _supabase
                    .from('amoo-academy')
                    .select('course_name, language, created_at')
                    .order('created_at', { ascending: false });

                loadingIndicator.classList.add('hidden');
                listContainer.classList.remove('hidden');

                if (error) {
                    throw error;
                }

                if (data && data.length > 0) {
                    data.forEach(course => {
                        const card = document.createElement('div');
                        card.className = "bg-white border border-slate-200 rounded-2xl p-6 hover:shadow-lg transition flex flex-col justify-between h-full";
                        
                        const courseName = course.course_name || 'Sagantaa hin beekamne | Unknown Course';
                        const language = course.language || 'Afaan hin beekamne | Unknown Language';
                        
                        card.innerHTML = `
                            <div>
                                <div class="inline-block px-3 py-1 mb-4 text-[10px] font-extrabold text-blue-700 bg-blue-50 border border-blue-200 rounded-full uppercase tracking-wider">
                                    ${language}
                                </div>
                                <h3 class="font-black text-slate-900 text-lg leading-snug mb-2">
                                    ${courseName}
                                </h3>
                            </div>
                            <div class="mt-6 pt-5 border-t border-slate-100">
                                <div class="w-full bg-slate-900 text-white text-center text-xs font-bold py-3.5 rounded-xl uppercase tracking-widest shadow-sm">
                                    200 Birr
                                </div>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    });
                } else {
                    listContainer.classList.remove('grid', 'sm:grid-cols-2');
                    listContainer.innerHTML = `
                        <div class="w-full border-2 border-dashed border-slate-300 rounded-2xl p-12 text-center bg-slate-50">
                            <p class="text-slate-500 font-bold text-sm uppercase tracking-wider">Koorsiihanga ammaatti hin galmoofne | No courses registered yet.</p>
                        </div>
                    `;
                }

            } catch (err) {
                loadingIndicator.classList.add('hidden');
                listContainer.classList.remove('hidden', 'grid', 'sm:grid-cols-2');
                console.error("Error fetching courses:", err);
                listContainer.innerHTML = `
                    <div class="w-full bg-red-50 border border-red-200 rounded-2xl p-6 text-center">
                        <p class="text-red-700 font-black text-sm uppercase mb-1">Dogongora uumameera | An error occurred</p>
                        <p class="text-red-600 text-xs font-medium">${err.message}</p>
                    </div>
                `;
            }
        }

        /**
         * Add a new course to Supabase
         */
        async function addCourse(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const formMessage = document.getElementById('form-message');
            const courseNameInput = document.getElementById('course_name').value;
            const languageInput = document.getElementById('language').value;
            
            // Loading state
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<div class="inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent mr-2"></div> Galaa jira... | Saving...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
            
            formMessage.classList.add('hidden');

            try {
                // Insert into Supabase table
                const { data, error } = await _supabase
                    .from('amoo-academy')
                    .insert([
                        { course_name: courseNameInput, language: languageInput }
                    ]);

                if (error) {
                    throw error;
                }

                formMessage.innerText = "Milkiin galmaa'eera! | Successfully registered!";
                formMessage.className = "text-xs font-bold text-center mt-3 block bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-2 rounded-lg";
                
                // Reset form fields
                document.getElementById('add-course-form').reset();
                
                // Auto-refresh the courses list
                getCourses();

            } catch (err) {
                console.error("Error adding course:", err);
                formMessage.innerText = "Dogongora | Error: " + err.message;
                formMessage.className = "text-xs font-bold text-center mt-3 block bg-red-50 text-red-700 border border-red-200 px-3 py-2 rounded-lg";
            } finally {
                // Return button to normal
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
            }
        }

        // Fetch courses on page load
        window.onload = getCourses;
    </script>
</body>
</html>
