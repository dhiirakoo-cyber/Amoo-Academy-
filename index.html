<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amoo Academy | E-Book Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #0f172a; }
        body.lang-om-only .lang-content-en, body.lang-om-only .lang-content-both-slash { display: none !important; }
        body.lang-en-only .lang-content-om, body.lang-en-only .lang-content-both-slash { display: none !important; }
        .modal { transition: opacity 0.3s ease, transform 0.3s ease; opacity: 0; pointer-events: none; }
        .modal.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <nav class="bg-white sticky top-0 z-40 border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
            <span class="text-xl font-black tracking-tight text-slate-900"><span class="text-blue-600">Amoo</span> Academy</span>
            <div class="flex bg-slate-100 border rounded-lg p-0.5 text-xs font-bold">
                <button onclick="setGlobalLang('om')" id="btn-lang-om" class="px-2 py-1 rounded-md text-slate-500">OM</button>
                <button onclick="setGlobalLang('en')" id="btn-lang-en" class="px-2 py-1 rounded-md text-slate-500">EN</button>
                <button onclick="setGlobalLang('both')" id="btn-lang-both" class="px-2 py-1 rounded-md bg-white text-slate-900 shadow-sm">OM/EN</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto px-4 py-12 w-full">
        <div id="loading-spinner" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
        </div>
        <div id="courses-container" class="grid grid-cols-1 md:grid-cols-3 gap-6 hidden"></div>
    </main>

    <div id="modal-payment" class="modal fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm relative">
            <button onclick="closeModal('modal-payment')" class="absolute top-4 right-4 text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            <h3 class="text-lg font-black text-slate-900 mb-2 text-center">Kaffaltii Mirkaneessi</h3>
            <p class="text-xs text-slate-600 text-center mb-4">Gatiin E-book kanaa flat rate <span class="font-bold text-blue-600">200 Birr</span> qofa. Kaffaltii erga raawwattanii booda fuyyila PDF argachuuf Telegram khaan ragaa ergaa.</p>
            <div class="bg-slate-50 p-3 rounded-xl mb-4 text-[11px] space-y-1 text-slate-700 border border-slate-100">
                <p><strong>CBE:</strong> 1000755134701</p>
                <p><strong>Telebirr:</strong> 0967145146</p>
            </div>
            
            <div class="flex flex-col gap-2">
                <button id="preview-pdf-btn" class="w-full bg-blue-100 hover:bg-blue-200 text-blue-700 text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 uppercase disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-eye"></i> PREVIEW PDF
                </button>
                <button id="download-pdf-btn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 uppercase disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-file-pdf"></i> DOWNLOAD / ERGI
                </button>
            </div>
        </div>
    </div>

    <footer class="bg-white py-4 border-t text-center text-[10px] font-bold text-slate-400 uppercase">
        &copy; 2026 Amoo Academy
    </footer>

    <script>
        const SUPABASE_URL = "https://hesjpceomicbhwbvqhdx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhlc2pwY2VvbWljYmh3YnZxaGR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTYwOTksImV4cCI6MjA5NTczMjA5OX0.hX3JVSe_WLmfVJjvR9qqx2zT0NmL6wc1vT-0hUJLDy0";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchLiveCourses() {
            try {
                const { data: courses, error } = await _supabase.from('courses').select('*');
                if (error) throw error;

                const container = document.getElementById('courses-container');
                document.getElementById('loading-spinner').classList.add('hidden');
                container.innerHTML = '';

                if(courses && courses.length > 0) {
                    courses.forEach(course => {
                        const card = document.createElement('div');
                        card.className = "bg-white border rounded-2xl overflow-hidden shadow-sm p-6 flex flex-col justify-between";
                        card.innerHTML = `
                            <div>
                                <img src="${course.thumbnail || 'https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500'}" class="w-full h-40 object-cover rounded-xl mb-4">
                                <span class="text-[10px] font-bold text-blue-600 bg-blue-50 border px-2.5 py-0.5 rounded-full uppercase">E-BOOK (PDF)</span>
                                <h3 class="font-extrabold text-base text-slate-900 mt-2">
                                    <span class="lang-content-om">${course.title_ao || 'Kitaaba Amoo'}</span>
                                    <span class="lang-content-en">${course.title_en || 'Amoo Book'}</span>
                                </h3>
                            </div>
                            <button onclick="openPaymentModal('${course.id}')" class="w-full mt-6 bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold py-2.5 rounded-xl uppercase tracking-wider">
                                <span class="lang-content-om">BITADHU (200 BIRR)</span>
                                <span class="lang-content-en">BUY NOW (200 BIRR)</span>
                            </button>
                        `;
                        container.appendChild(card);
                    });
                }
                container.classList.remove('hidden');
            } catch (err) { console.error(err); }
        }

        async function openPaymentModal(courseId) {
            openModal('modal-payment');
            const downloadBtn = document.getElementById('download-pdf-btn');
            const previewBtn = document.getElementById('preview-pdf-btn');
            
            if (!downloadBtn) return;
            
            downloadBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Loading...`;
            downloadBtn.disabled = true;
            downloadBtn.style.opacity = "0.6";

            if (previewBtn) {
                previewBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Loading Preview...`;
                previewBtn.disabled = true;
                previewBtn.style.opacity = "0.6";
            }

            const defaultLink = "https://t.me/amotech2025";

            try {
                const { data: records, error } = await _supabase
                    .from('courses')
                    .select('file_url, preview_url, id');

                if (error) throw error;

                let data = null;
                if (records && records.length > 0) {
                    data = records.find(r => String(r.id) === String(courseId)) || records[0];
                }

                if (data && data.file_url && data.file_url.trim() !== "") {
                    downloadBtn.setAttribute('data-link', data.file_url.trim());
                } else {
                    downloadBtn.setAttribute('data-link', defaultLink);
                }
                downloadBtn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> PDF KALLATTIIN BANADHU / ERGI`;
                downloadBtn.disabled = false;
                downloadBtn.style.opacity = "1";
                downloadBtn.style.backgroundColor = "#047857";

                if (previewBtn) {
                    if (data && data.preview_url && data.preview_url.trim() !== "") {
                        previewBtn.setAttribute('data-preview', data.preview_url.trim());
                    } else {
                        previewBtn.setAttribute('data-preview', defaultLink);
                    }
                    previewBtn.innerHTML = `<i class="fa-solid fa-book-open"></i> BILISAAN DUBBISI (20%)`;
                    previewBtn.disabled = false;
                    previewBtn.style.opacity = "1";
                    previewBtn.style.backgroundColor = "#4A5568";
                }

            } catch (err) {
                console.error("Error fetching data:", err);
                downloadBtn.setAttribute('data-link', defaultLink);
                downloadBtn.innerHTML = `<i class="fa-solid fa-file-pdf"></i> PDF KALLATTIIN BANADHU / ERGI`;
                downloadBtn.disabled = false;
                downloadBtn.style.backgroundColor = "#047857";

                if (previewBtn) {
                    previewBtn.setAttribute('data-preview', defaultLink);
                    previewBtn.innerHTML = `<i class="fa-solid fa-book-open"></i> BILISAAN DUBBISI (20%)`;
                    previewBtn.disabled = false;
                    previewBtn.style.backgroundColor = "#4A5568";
                }
            }
        }

        document.getElementById('download-pdf-btn').addEventListener('click', function() {
            const fileUrl = this.getAttribute('data-link');
            if(fileUrl && fileUrl !== "") {
                window.open(fileUrl, '_blank');
            }
        });

        document.getElementById('preview-pdf-btn').addEventListener('click', function() {
            const previewUrl = this.getAttribute('data-preview');
            if(previewUrl && previewUrl !== "") {
                window.open(previewUrl, '_blank');
            }
        });

        function setGlobalLang(lang) {
            document.body.classList.remove('lang-om-only', 'lang-en-only');
            if(lang !== 'both') document.body.classList.add(`lang-${lang}-only`);
        }
        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        window.onload = fetchLiveCourses;
    </script>
</body>
</html>
